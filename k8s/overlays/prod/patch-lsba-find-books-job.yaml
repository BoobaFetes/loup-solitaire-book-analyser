apiVersion: batch/v1
kind: Job
metadata:
  name: lsba-find-books-job
  namespace: lsba-ns
spec:
  template:
    spec:
      serviceAccountName: lsba-sa-noright-prod
      securityContext:
          fsGroup: 4200
          runAsGroup: 4200
          runAsUser: 4201
      volumes:
        - name: project-volume
          persistentVolumeClaim:
            claimName: lsba-pvc-prod