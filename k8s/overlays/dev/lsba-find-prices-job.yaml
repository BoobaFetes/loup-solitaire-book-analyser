apiVersion: batch/v1
kind: Job
metadata:
  name: lsba-find-prices-job
  namespace: lsba-ns
  labels:
    role: lsba-batch
spec:
  backoffLimit: 2 # 2 tentatives max en cas d'echec
  template:
    spec:
      serviceAccountName: lsba-sa-no-access-dev
      securityContext:
        runAsNonRoot: true
        runAsUser: 4001
        runAsGroup: 4000
        fsGroup: 4000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: project-volume
          persistentVolumeClaim:
            claimName: lsba-pvc-dev
      initContainers:
        # pour les tests, il faut un container d'attente pour conserver la logique : on récupère les livre et ensuite on recherche leurs prix
        # le plus simple est d'utiliser un timer car on connait le temps d'execution de find_books.py
        - image: alpine
          name: wait-for-find-books-ends
          command:
            - "sh"
            - "-c"
            - "sleep 70"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - image: loup-solitaire-book-analyser:v0.1.3
          name: lsba-find-prices
          args: ["src/find_prices.py"]
          envFrom:
            - configMapRef:
                name: lsba-cm-dev
                optional: false
          volumeMounts:
            - name: project-volume
              mountPath: /app/data
              subPath: data
            - name: project-volume
              mountPath: /app/logs
              subPath: logs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              # playwright semble au max avoir besoin de ~800Mi de mémoire et ~1.6 de cpu
              memory: "1Gi"
              cpu: "2"
            requests:
              # playwright necessite au moins 400Mi de mémoire et ~0.8 cpu au min
              memory: "400Mi"
              cpu: "0.8"
      restartPolicy: Never # on veut un nouveau pod en cas d'echec pour analyser les erreurs (tous les logs ne vont pas forcément dans les fichers logs du PVC)
