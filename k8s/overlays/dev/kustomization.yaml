apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lsba-ns-dev
nameSuffix: -dev

resources:
  - ../../base
  - ../../database
  - lsba-find-books-job.yaml
  - lsba-find-prices-job.yaml
  - lsba-pv.yaml
  - lsba-secret-postgresql-credentials.yaml

patches:  
  - path: patch-lsba-find-books-cronjob.yaml
  - path: patch-lsba-find-prices-cronjob.yaml
  - path: patch-lsba-sc.yaml
  - path: patch-lsba-pvc.yaml

helmCharts:
- name: postgresql
  repo: https://charts.bitnami.com/bitnami
  releaseName: lsba-db-postgresql
  namespace: lsba-ns-dev
  version: 18.7.11
  valuesFile: bitnami-postgresql-values.yaml
        

